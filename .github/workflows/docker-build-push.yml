name: Build & Push All Docker Images
on:
  push:
    tags:
      - "v*"

jobs:
  reverse-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ GHCR_PAT }}
      - name: Build & Push Reverse Proxy
        uses: docker/build-push-action@v5
        with:
          context: ReverseProxy/.
          push: true
          tags: |
            ghcr.io/mostafaosmanfathi/ragmind/reverse-proxy:latest
            ghcr.io/mostafaosmanfathi/ragmind/reverse-proxy:${{ github.ref_name }}

  rag-service:
    runs-on: ubuntu-latest
    needs: [reverse-proxy]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ GHCR_PAT }}
      - name: Build & Push Rag Service
        uses: docker/build-push-action@v5
        with:
          context: RagService/.
          push: true
          tags: |
            ghcr.io/mostafaosmanfathi/ragmind/rag-service:latest
            ghcr.io/mostafaosmanfathi/ragmind/rag-service:${{ github.ref_name }}

  frontend:
    runs-on: ubuntu-latest
    needs: [reverse-proxy]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ GHCR_PAT }}
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: Frontend/.
          push: true
          tags: |
            ghcr.io/mostafaosmanfathi/ragmind/frontend:latest
            ghcr.io/mostafaosmanfathi/ragmind/frontend:${{ github.ref_name }}

  ollama:
    runs-on: ubuntu-latest
    needs: [rag-service]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ GHCR_PAT }}
      - name: Build & Push Ollama
        uses: docker/build-push-action@v5
        with:
          context: Ollama/.
          push: true
          tags: |
            ghcr.io/mostafaosmanfathi/ragmind/ollama:latest
            ghcr.io/mostafaosmanfathi/ragmind/ollama:${{ github.ref_name }}

  rabbitmq:
    runs-on: ubuntu-latest
    needs: [rag-service]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ GHCR_PAT }}
      - name: Build & Push RabbitMQ
        uses: docker/build-push-action@v5
        with:
          context: Rabbitmq/.
          push: true
          tags: |
            ghcr.io/mostafaosmanfathi/ragmind/rabbitmq:latest
            ghcr.io/mostafaosmanfathi/ragmind/rabbitmq:${{ github.ref_name }}

  rag-backend:
    runs-on: ubuntu-latest
    needs: [rabbitmq, pg-database]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ GHCR_PAT }}
      - name: Build & Push Rag Backend
        uses: docker/build-push-action@v5
        with:
          context: RagBackend/.
          push: true
          tags: |
            ghcr.io/mostafaosmanfathi/ragmind/rag-backend:latest
            ghcr.io/mostafaosmanfathi/ragmind/rag-backend:${{ github.ref_name }}

  pg-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ GHCR_PAT }}
      - name: Build & Push Postgres
        uses: docker/build-push-action@v5
        with:
          context: Database/.
          push: true
          tags: |
            ghcr.io/mostafaosmanfathi/ragmind/pg-database:latest
            ghcr.io/mostafaosmanfathi/ragmind/pg-database:${{ github.ref_name }}
          build-args: |
            POSTGRES_DB=ragdb
            POSTGRES_USER=admin
            POSTGRES_PASSWORD=admin_password

  redis-database:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Redis Image
        run: docker pull redis:8.4.0
      - name: Tag and Push Redis to GHCR
        run: |
          echo ${{ GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag redis:8.4.0 ghcr.io/mostafaosmanfathi/ragmind/redis-database:latest
          docker tag redis:8.4.0 ghcr.io/mostafaosmanfathi/ragmind/redis-database:${{ github.ref_name }}
          docker push ghcr.io/mostafaosmanfathi/ragmind/redis-database:latest
          docker push ghcr.io/mostafaosmanfathi/ragmind/redis-database:${{ github.ref_name }}

  n8n:
    runs-on: ubuntu-latest
    needs: [rag-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ GHCR_PAT }}
      - name: Build & Push n8n
        uses: docker/build-push-action@v5
        with:
          context: n8n/.
          push: true
          tags: |
            ghcr.io/mostafaosmanfathi/ragmind/n8n:latest
            ghcr.io/mostafaosmanfathi/ragmind/n8n:${{ github.ref_name }}

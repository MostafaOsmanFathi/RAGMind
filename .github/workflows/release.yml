name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Render docker-compose
        run: |
          sed "s/{{TAG}}/${GITHUB_REF##*/}/g" \
            .github/templates/docker-compose.template.yml \
            > docker-compose.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
                This release includes the generated docker-compose.yml for version ${{ github.ref_name }}.
          
                **How to use:**
                1. Download the attached `docker-compose.yml` file from the release assets.
                2. Ensure Docker and Docker Compose are installed on your machine.
                3. Run:
                   ```bash
                   docker-compose up -d
                   ```
                4. Services included:
                   - reverse-proxy
                   - rag-service
                   - frontend
                   - rag-backend
                   - pg_database
                   - redis_database
                   - n8n
                   - ollama
                   - rabbitmq
                5. Modify `.env` or configuration files if needed for your environment.
          files: docker-compose.yml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
